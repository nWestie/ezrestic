[project]
name = "ezrestic"
version = "0.5.0"
description = "A wrapper around restic to simplify running backups"
readme = "README.md"
authors = [{ name = "Noah", email = "westnoahb@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
ezrestic = "ezrestic:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
